<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ireland Industry Sustainability Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f6f8fa; margin: 0; padding: 40px; }
    #vis { width: 900px; height: 650px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .header { margin-bottom: 30px; text-align: center; color: #2c3e50; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Irish Industry Environmental Impact</h1>
    <p>Data Source: CSO Ireland | Interactive Trade-off Analysis</p>
  </div>
  <div id="vis"></div>
  <script>
    vegaEmbed('#vis', 'visualization.vl.json', {actions: false}).catch(console.error);
  </script>
</body>
</html>
