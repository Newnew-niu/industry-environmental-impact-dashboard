<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <style>
        body { display: flex; justify-content: center; background-color: #f5f5f5; padding-top: 50px; }
        #vis { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="vis"></div>
    <script>
        const spec = "visualization.vl.json";
        vegaEmbed('#vis', spec).catch(console.error);
    </script>
</body>
</html>
