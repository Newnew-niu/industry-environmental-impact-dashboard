<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ireland Industry Sustainability Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: white;
    }
    .header {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    #vis {
      width: 900px;
      height: 650px;
      background: white;
      border: none;
      outline: none;
      padding: 0;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Irish Industry Environmental Impact</h1>
    <p>Data Source: CSO Ireland | Interactive Trade-off Analysis</p>
  </div>
  <div id="vis"></div>
  <script>
    vegaEmbed('#vis', 'visualization.vl.json', {actions: false, config: {axis: {grid: false}}}).catch(console.error);
  </script>
</body>
</html>
